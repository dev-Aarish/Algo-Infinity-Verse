<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Execution History — Algo Infinity Verse</title>

    <!-- SEO / Social metadata -->
    <meta
      name="description"
      content="Browse your past code runs, inspect outputs, and replay step-by-step variable traces on Algo Infinity Verse."
    />
    <meta property="og:title" content="Execution History — Algo Infinity Verse" />
    <meta property="og:description" content="Browse, inspect, and replay your code execution history." />
    <meta name="twitter:title" content="Execution History — Algo Infinity Verse" />
    <meta name="twitter:description" content="Browse, inspect, and replay your code execution history." />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F2D5C4" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: DM Serif Display (display), Inter (body), JetBrains Mono (code) -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles/execution-history.css" />

    <script src="theme.js"></script>

    <!-- Theme Initialization -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var p = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = t || (p ? 'light' : 'dark');
          if (theme === 'light') document.documentElement.classList.add('light-mode');
          else document.documentElement.classList.remove('light-mode');
        } catch (e) {}
      })();
    </script>

    <script type="importmap">
    {
      "imports": {}
    }
    </script>
  </head>
  <body data-page="execution-history" data-no-loading>
    <div id="navbar"></div>

    <main id="app">
      <!-- HERO -->
      <section class="eh-hero">
        <div class="eh-hero-bg" aria-hidden="true">
          <div class="eh-hero-grid"></div>
        </div>
        <div class="eh-hero-content">
          <h1 class="eh-hero-title">
            <span class="eh-gradient-text">Execution History</span>
          </h1>
          <p class="eh-hero-subtitle">
            Browse your past code runs, inspect outputs, and replay step-by-step variable traces.
          </p>
        </div>
      </section>

      <!-- FILTERS -->
      <div class="eh-filters" id="ehFilters">
        <!-- rendered by JS -->
      </div>

      <!-- MAIN CONTENT -->
      <div class="eh-container" id="execHistoryRoot">
        <div class="eh-loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
      </div>
    </main>

    <script src="auth.js"></script>
    <script src="auth-gate.js"></script>
    <script type="module">
      import { initNavbar } from "/modules/navbar.js";
      import { ExecutionHistory } from "/modules/executionHistory.js";

      async function loadPartial(id, url) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("Not found");
          const html = await res.text();
          document.getElementById(id).innerHTML = html;
        } catch {
          console.warn("Failed to load", url);
        }
      }

      // Load navbar only (no footer per design requirement)
      await loadPartial("navbar", "/partials/navbar.html");
      initNavbar();

      const root = document.getElementById("execHistoryRoot");
      if (root) {
        new ExecutionHistory(root);
      }
    </script>
  </body>
</html>
