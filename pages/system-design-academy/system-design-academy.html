<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="system-design-academy.css">
    <link rel="stylesheet" href="/styles/eli5-toggle.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex overflow-hidden">

    <button id="mobile-menu-btn" class="md:hidden fixed top-4 right-4 z-50 p-2 bg-indigo-600 text-white rounded shadow-lg">
        <i class="fas fa-bars"></i>
    </button>

    <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 h-full flex flex-col transition-transform duration-300 absolute md:relative z-40 -translate-x-full md:translate-x-0">
        <div class="p-4 border-b border-gray-200 bg-indigo-50 flex items-center gap-3">
            <i class="fas fa-sitemap text-indigo-600 text-2xl"></i>
            <h1 class="font-bold text-lg text-indigo-900">System Design</h1>
        </div>

        <div class="p-4 border-b border-gray-200">
            <div class="flex justify-between text-xs mb-1 font-semibold text-gray-500">
                <span>Progress</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div id="sidebar-content" class="flex-1 overflow-y-auto p-4 space-y-4">
        </div>
    </aside>

    <main class="flex-1 h-full flex flex-col relative w-full">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex space-x-4 shadow-sm z-10">
            <button class="tab-btn active px-4 py-2 font-medium rounded-t-lg border-b-2 border-indigo-600 text-indigo-600 transition-colors" data-tab="lesson">
                <i class="fas fa-book-open mr-2"></i>Lesson Viewer
            </button>
            <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-indigo-600 transition-colors" data-tab="canvas">
                <i class="fas fa-archway mr-2"></i>Architecture Canvas
            </button>
            <button class="tab-btn px-4 py-2 font-medium text-gray-500 hover:text-indigo-600 transition-colors" data-tab="quiz">
                <i class="fas fa-tasks mr-2"></i>Quiz
            </button>
        </header>

        <div class="flex-1 overflow-y-auto relative bg-gray-50">
            <div id="lesson-tab" class="tab-pane absolute inset-0 p-8 fade-in block">
                <div id="lesson-content" class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                </div>
            </div>

            <div id="canvas-tab" class="tab-pane absolute inset-0 hidden fade-in h-full flex flex-col p-4 gap-4">
                <div id="canvas-content" class="flex-1 flex flex-col gap-4 h-full">
                    <div class="flex-1 bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden flex flex-col">
                        <div class="bg-gray-100 px-4 py-2 border-b border-gray-200 flex justify-between items-center">
                            <span class="font-semibold text-gray-700 text-sm"><i class="fas fa-archway mr-2"></i>Interactive Architecture Canvas</span>
                            <a href="/pages/learning/system-design-canvas/index.html" target="_blank" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded text-sm font-medium transition-colors shadow-sm">
                                <i class="fas fa-external-link-alt mr-2"></i>Open Full Screen
                            </a>
                        </div>
                        <div id="canvas-pane" class="flex-1 overflow-hidden bg-white relative">
                            <div class="canvas-placeholder">
                                <i class="fas fa-archway"></i>
                                <h3>Architecture Canvas</h3>
                                <p>Design and visualize system architectures with the interactive drag-and-drop canvas. Add components, draw connections, and simulate traffic flow.</p>
                                <a href="/pages/learning/system-design-canvas/index.html" target="_blank" class="inline-block bg-white text-indigo-700 px-3 py-1 rounded text-xs font-medium transition-colors hover:bg-indigo-50">
                                    <i class="fas fa-external-link-alt mr-1"></i>Open Canvas
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="quiz-tab" class="tab-pane absolute inset-0 p-8 hidden fade-in">
                <div id="quiz-content" class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                </div>
            </div>
        </div>
    </main>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>

    <script src="/modules/eli5-toggle.js"></script>
    <script src="/modules/eli5-system-design-data.js"></script>
    <script src="system-design-academy.js"></script>
</body>
</html>
