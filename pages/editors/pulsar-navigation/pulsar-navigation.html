<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulsar Navigation Matrix | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Monaco Editor -->
    <script src="https://unpkg.com/monaco-editor@0.36.1/min/vs/loader.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; font-family: 'Poppins', sans-serif; color: #fff; }
      .app-container { display: flex; height: 100vh; }
      
      .sidebar { width: 450px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid #0ea5e9; display: flex; flex-direction: column; z-index: 10; }
      .header { padding: 20px; border-bottom: 1px solid #334155; }
      .header h2 { margin: 0; color: #0ea5e9; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; }
      .header p { margin: 5px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
      
      #editor-container { flex: 1; min-height: 300px; }
      
      .controls { padding: 20px; border-top: 1px solid #334155; background: rgba(0,0,0,0.5); }
      .btn { background: linear-gradient(90deg, #0284c7, #0369a1); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
      .btn:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 0 15px rgba(14, 165, 233, 0.5); }
      
      .sim-container { flex: 1; position: relative; background: #020617; overflow: hidden; }
      
      canvas { width: 100%; height: 100%; display: block; }
      
      .hud { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #0ea5e9; width: 280px; z-index: 10; pointer-events: none; }
      .hud h3 { margin: 0 0 10px 0; color: #0ea5e9; font-size: 1rem; font-family: 'Orbitron', sans-serif; }
      .metric { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
      .val { font-weight: bold; font-family: monospace; }
      .val-accuracy { color: #facc15; }
      .val-noise { color: #f43f5e; }
    </style>
  </head>
  <body>
    
    <div class="app-container">
      <div class="sidebar">
        <div class="header">
          <h2><i class="fas fa-satellite-dish"></i> Pulsar Array Matrix</h2>
          <p>Triangulate position using millisecond pulsars</p>
        </div>
        
        <div id="editor-container"></div>
        
        <div class="controls">
          <button class="btn" onclick="initiateScan()"><i class="fas fa-radar"></i> Initialize Sensor Array</button>
        </div>
      </div>
      
      <div class="sim-container">
        <canvas id="galaxyCanvas" style="position: relative; z-index: 1;"></canvas>
        
        <div class="hud">
          <h3>Navigational Telemetry</h3>
          <div class="metric"><span>Pulsars Locked:</span> <span class="val val-accuracy" id="lockVal">0 / 4</span></div>
          <div class="metric"><span>Signal Noise:</span> <span class="val val-noise" id="noiseVal">100%</span></div>
          <div class="metric"><span>Position Error:</span> <span class="val" id="errorVal">UNKNOWN</span></div>
          <div class="metric" style="margin-top: 10px; border-top: 1px solid #334155; padding-top: 5px;">
            <span>System Status:</span> <span class="val" id="statusVal" style="color:#94a3b8">OFFLINE</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let editor;
      require.config({ paths: { 'vs': 'https://unpkg.com/monaco-editor@0.36.1/min/vs' }});
      require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor-container'), {
          value: `// Pulsar Signal Filter Algorithm
// Interstellar medium dispersion and gravitational waves corrupt the incoming signals.
// A pure pulsar signal is a perfect sine wave. You must filter out the noise.

function filterSignalNoise(rawSignal, timeIndex) {
    // Return the cleaned float value.
    
    // Naive logic: Just return the raw signal!
    // The navigation computer cannot lock onto noisy data. Position error will be infinite.
    
    return rawSignal;
}`,
          language: 'javascript',
          theme: 'vs-dark',
          minimap: { enabled: false },
          automaticLayout: true
        });
      });

      const canvas = document.getElementById('galaxyCanvas');
      const ctx = canvas.getContext('2d');
      
      let isSimulating = false;
      let time = 0;
      let frame = 0;
      
      let shipX = 0;
      let shipY = 0;
      let actualShipX = 0;
      let actualShipY = 0;
      
      let pulsars = [];
      let lockCount = 0;
      let posError = 1000;
      
      function resize() { 
          canvas.width = canvas.clientWidth; 
          canvas.height = canvas.clientHeight;
          
          actualShipX = canvas.width / 2;
          actualShipY = canvas.height / 2;
          
          initPulsars();
      }
      
      function initPulsars() {
          pulsars = [
              { x: 100, y: 100, freq: 0.1, color: '#38bdf8', phase: 0 },
              { x: canvas.width - 100, y: 150, freq: 0.15, color: '#a78bfa', phase: 0 },
              { x: 150, y: canvas.height - 100, freq: 0.08, color: '#f472b6', phase: 0 },
              { x: canvas.width - 150, y: canvas.height - 150, freq: 0.12, color: '#4ade80', phase: 0 }
          ];
      }
      
      setTimeout(resize, 100);
      window.addEventListener('resize', resize);

      function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          // Draw grid
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1;
          for(let x=0; x<canvas.width; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
          for(let y=0; y<canvas.height; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
          
          if (isSimulating) {
              time += 0.05;
              frame++;
              
              lockCount = 0;
              let totalNoise = 0;
              let calculatedX = 0;
              let calculatedY = 0;
              
              // Process signals
              for(let i=0; i<pulsars.length; i++) {
                  let p = pulsars[i];
                  p.phase += p.freq;
                  
                  // Pure signal
                  let pureSignal = Math.sin(p.phase);
                  
                  // Add noise (Dispersion + Grav waves)
                  let noiseLevel = Math.sin(time*2.5 + i) * 0.5 + (Math.random()-0.5) * 1.5;
                  let rawSignal = pureSignal + noiseLevel;
                  
                  // Filter via user code
                  let filtered = rawSignal;
                  try {
                      eval(editor.getValue());
                      filtered = filterSignalNoise(rawSignal, time);
                  } catch(e) {}
                  
                  // Determine lock based on error
                  let error = Math.abs(pureSignal - filtered);
                  totalNoise += error;
                  
                  if (error < 0.2) {
                      lockCount++;
                      // Triangulation vector (simplified)
                      calculatedX += p.x * 0.25;
                      calculatedY += p.y * 0.25;
                      
                      // Draw locked beam
                      ctx.strokeStyle = p.color;
                      ctx.lineWidth = 2;
                      ctx.setLineDash([5, 10]);
                      ctx.beginPath();
                      ctx.moveTo(p.x, p.y);
                      ctx.lineTo(actualShipX, actualShipY);
                      ctx.stroke();
                      ctx.setLineDash([]);
                  }
                  
                  // Draw Pulsar
                  let radius = 10 + Math.sin(p.phase)*5;
                  ctx.fillStyle = p.color;
                  ctx.beginPath();
                  ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
                  ctx.fill();
                  
                  ctx.shadowBlur = 20;
                  ctx.shadowColor = p.color;
                  ctx.fill();
                  ctx.shadowBlur = 0;
                  
                  // Signal Ring pulse
                  if(frame % 20 === 0) {
                      p.rings = p.rings || [];
                      p.rings.push({r: radius, alpha: 1});
                  }
                  
                  if(p.rings) {
                      for(let r=p.rings.length-1; r>=0; r--) {
                          let ring = p.rings[r];
                          ring.r += 2;
                          ring.alpha -= 0.02;
                          if(ring.alpha <= 0) { p.rings.splice(r,1); continue; }
                          
                          ctx.strokeStyle = \`rgba(\${hexToRgb(p.color)}, \${ring.alpha})\`;
                          ctx.lineWidth = 1;
                          ctx.beginPath(); ctx.arc(p.x, p.y, ring.r, 0, Math.PI*2); ctx.stroke();
                      }
                  }
              }
              
              if (lockCount === 4) {
                  // Perfect Triangulation
                  shipX += (actualShipX - shipX) * 0.1;
                  shipY += (actualShipY - shipY) * 0.1;
                  posError = Math.hypot(shipX - actualShipX, shipY - actualShipY);
                  document.getElementById('statusVal').innerText = "TRIANGULATION LOCK";
                  document.getElementById('statusVal').style.color = "#10b981";
              } else {
                  // Drift due to unknown position
                  shipX += (Math.random()-0.5) * 10;
                  shipY += (Math.random()-0.5) * 10;
                  posError = Math.hypot(shipX - actualShipX, shipY - actualShipY);
                  document.getElementById('statusVal').innerText = "POSITION LOST IN DEEP SPACE";
                  document.getElementById('statusVal').style.color = "#ef4444";
              }
              
              // HUD
              document.getElementById('lockVal').innerText = \`\${lockCount} / 4\`;
              document.getElementById('noiseVal').innerText = (totalNoise * 10).toFixed(1) + "%";
              document.getElementById('errorVal').innerText = posError.toFixed(1) + " ly";
              if(posError > 100) document.getElementById('errorVal').style.color = "#ef4444";
              else document.getElementById('errorVal').style.color = "#10b981";
          }
          
          // Draw Ship (Actual vs Estimated)
          if(isSimulating) {
              // Estimated Pos (Ghost)
              ctx.fillStyle = 'rgba(255,255,255,0.3)';
              ctx.beginPath(); ctx.arc(shipX, shipY, 15, 0, Math.PI*2); ctx.fill();
              
              // Actual Pos
              ctx.fillStyle = '#fff';
              ctx.beginPath(); ctx.arc(actualShipX, actualShipY, 5, 0, Math.PI*2); ctx.fill();
          }

          requestAnimationFrame(animate);
      }
      
      function hexToRgb(hex) {
          let r = parseInt(hex.slice(1,3), 16);
          let g = parseInt(hex.slice(3,5), 16);
          let b = parseInt(hex.slice(5,7), 16);
          return \`\${r},\${g},\${b}\`;
      }
      
      animate();

      function initiateScan() {
          if(isSimulating) return;
          isSimulating = true;
          time = 0;
          shipX = 0;
          shipY = 0;
          document.getElementById('statusVal').innerText = "CALIBRATING ARRAY...";
          document.getElementById('statusVal').style.color = "#38bdf8";
      }
    </script>
  </body>
</html>
