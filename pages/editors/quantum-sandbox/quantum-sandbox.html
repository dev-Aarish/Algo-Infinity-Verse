<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Algorithm Simulator (Qubit Sandbox) | Algo Infinity Verse</title>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .quantum-container { padding: 40px 20px; max-width: 1200px; margin: 0 auto; color: #e2e8f0; }
      .q-gate { width: 50px; height: 50px; background: rgba(139, 92, 246, 0.2); border: 2px solid #8b5cf6; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin: 10px; }
      .q-gate:hover { background: #8b5cf6; color: #fff; transform: translateY(-2px); }
      .q-wire { height: 2px; background: #475569; width: 100%; position: relative; margin: 40px 0; display: flex; align-items: center; }
      .q-qubit { position: absolute; left: -40px; font-weight: bold; color: #38bdf8; }
      .q-board { background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; padding: 40px; border-radius: 12px; min-height: 300px; margin-top: 20px; }
      .q-gate-drop { width: 60px; height: 60px; border: 2px dashed #475569; border-radius: 8px; margin-left: 20px; }
      .q-controls { display: flex; gap: 15px; margin-top: 20px; }
      .q-panel { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #1e293b; padding: 20px; border-radius: 12px; }
    </style>
  </head>
  <body class="dark-mode" style="background: #020617;">
    <div id="navbar-placeholder"></div>

    <div class="quantum-container">
      <h1 style="background: linear-gradient(90deg, #38bdf8, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><i class="fas fa-atom"></i> Quantum Algorithm Simulator</h1>
      <p style="color: #94a3b8;">Construct quantum circuits to simulate algorithmic superposition and entanglement.</p>
      
      <div style="display: flex; gap: 20px; margin-top: 30px;">
        
        <!-- Left Panel: Gates & Execution -->
        <div class="q-panel" style="flex: 2;">
          <h3><i class="fas fa-toolbox"></i> Available Gates</h3>
          <div style="display: flex;">
            <div class="q-gate" onclick="addGate('H', 0)">H</div>
            <div class="q-gate" onclick="addGate('X', 0)">X</div>
            <div class="q-gate" onclick="addGate('Y', 0)">Y</div>
            <div class="q-gate" onclick="addGate('Z', 0)">Z</div>
            <div class="q-gate" onclick="addGate('CNOT', 0)" style="width: 70px;">CNOT</div>
          </div>

          <h3><i class="fas fa-microchip"></i> Circuit Board (2 Qubits)</h3>
          <div class="q-board">
            <div class="q-wire" id="wire-0"><div class="q-qubit">|q0⟩</div></div>
            <div class="q-wire" id="wire-1"><div class="q-qubit">|q1⟩</div></div>
          </div>

          <div class="q-controls">
            <button class="btn btn-primary" onclick="simulateQuantum()"><i class="fas fa-bolt"></i> Simulate Collapse</button>
            <button class="btn btn-secondary" onclick="resetCircuit()"><i class="fas fa-undo"></i> Reset</button>
          </div>
        </div>

        <!-- Right Panel: State Vector & Probabilities -->
        <div class="q-panel" style="flex: 1;">
          <h3><i class="fas fa-chart-bar"></i> Wave Function Probabilities</h3>
          <canvas id="qChart"></canvas>
          <div id="qOutput" style="margin-top: 20px; font-family: monospace; color: #a7f3d0; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px;">
            State Vector: |ψ⟩ = 1.00|00⟩
          </div>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/script.js"></script>
    <script type="module" src="/dist/legacy-bundle.mjs"></script>
    <script>
      // Load partials safely
      fetch('/partials/navbar.html').then(r=>r.text()).then(html => document.getElementById('navbar-placeholder').innerHTML = html).catch(e => console.log('Navbar load failed.'));
      fetch('/partials/footer.html').then(r=>r.text()).then(html => document.getElementById('footer-placeholder').innerHTML = html).catch(e => console.log('Footer load failed.'));

      // Quantum State Variables
      let gates = { 0: [], 1: [] };
      let qChartInstance = null;

      function addGate(gate, wireIdx) {
        // Toggle wire for demo (distribute gates alternately)
        let w = Object.keys(gates).reduce((a, b) => gates[a].length <= gates[b].length ? a : b);
        gates[w].push(gate);
        
        const wire = document.getElementById(`wire-${w}`);
        const el = document.createElement("div");
        el.className = "q-gate";
        el.style.margin = "0 10px";
        el.innerText = gate;
        wire.appendChild(el);
      }

      function resetCircuit() {
        gates = { 0: [], 1: [] };
        document.getElementById('wire-0').innerHTML = '<div class="q-qubit">|q0⟩</div>';
        document.getElementById('wire-1').innerHTML = '<div class="q-qubit">|q1⟩</div>';
        document.getElementById('qOutput').innerText = "State Vector: |ψ⟩ = 1.00|00⟩";
        renderChart([1, 0, 0, 0]);
      }

      function simulateQuantum() {
        const out = document.getElementById('qOutput');
        out.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Multiplying Tensor Matrices...";
        
        setTimeout(() => {
          // Simulate a quantum probability distribution based on number of Hadamard gates
          let hCount = gates[0].filter(g => g === 'H').length + gates[1].filter(g => g === 'H').length;
          
          let probs = [0, 0, 0, 0];
          if (hCount === 0) {
            probs = [1, 0, 0, 0];
          } else if (hCount === 1) {
            probs = [0.5, 0.5, 0, 0];
          } else {
            probs = [0.25, 0.25, 0.25, 0.25]; // Max superposition
          }

          // If X gate, flip probabilities for demo
          if (gates[0].includes('X')) { probs = [probs[1], probs[0], probs[3], probs[2]]; }

          renderChart(probs);
          out.innerHTML = "Wave Function Collapsed.<br>Measured State: " + probs.map((p,i) => `|${(i>>>0).toString(2).padStart(2,'0')}⟩: ${(p*100).toFixed(1)}%`).join("<br>");
        }, 1000);
      }

      function renderChart(probs) {
        const ctx = document.getElementById('qChart');
        if (qChartInstance) qChartInstance.destroy();
        qChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['|00⟩', '|01⟩', '|10⟩', '|11⟩'],
            datasets: [{
              label: 'Probability',
              data: probs,
              backgroundColor: ['#8b5cf6', '#38bdf8', '#f59e0b', '#10b981']
            }]
          },
          options: { responsive: true, scales: { y: { max: 1, min: 0 } } }
        });
      }

      // Init
      renderChart([1, 0, 0, 0]);
    </script>
  </body>
</html>
